<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f2328">What to connect (schematic, not to scale)</text>

  <!-- laptop -->
  <rect x="30" y="110" width="220" height="140" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <rect x="48" y="126" width="184" height="104" rx="4" fill="#0d1117"/>
  <text x="140" y="175" text-anchor="middle" fill="#e6edf3">PuTTY + Ubuntu</text>
  <text x="140" y="195" text-anchor="middle" fill="#7ee787" font-size="12">192.168.10.1</text>
  <rect x="12" y="250" width="256" height="14" rx="4" fill="#d0d7de"/>
  <text x="140" y="288" text-anchor="middle" fill="#1f2328" font-weight="bold">Your laptop</text>

  <!-- board -->
  <rect x="460" y="50" width="420" height="340" rx="10" fill="#1b4d3e" stroke="#0e2a22" stroke-width="2"/>
  <text x="670" y="378" text-anchor="middle" fill="#ffffff" font-weight="bold">DE10-Standard</text>

  <!-- left edge: connectors, top to bottom -->
  <rect x="448" y="70" width="34" height="22" rx="3" fill="#d0d7de" stroke="#57606a"/>
  <text x="492" y="86" fill="#ffffff" font-size="12">UART mini-USB ✔</text>
  <rect x="448" y="102" width="30" height="16" rx="2" fill="#8c959f"/>
  <rect x="448" y="124" width="30" height="16" rx="2" fill="#8c959f"/>
  <text x="492" y="126" fill="#d0d7de" font-size="12">2 × USB host</text>
  <rect x="444" y="152" width="46" height="38" rx="3" fill="#d0d7de" stroke="#57606a"/>
  <text x="500" y="176" fill="#ffffff" font-size="12">Ethernet (RJ45) ✔</text>
  <rect x="448" y="300" width="34" height="30" rx="3" fill="#8c959f" stroke="#57606a"/>
  <text x="492" y="312" fill="#ffb3b3" font-size="12">USB-Blaster (square USB-B)</text>
  <text x="492" y="327" fill="#ffb3b3" font-size="11">programs the FPGA, no console</text>
  <circle cx="465" cy="355" r="10" fill="#8c959f" stroke="#57606a"/>
  <text x="492" y="359" fill="#ffffff" font-size="12">Power 12 V</text>

  <!-- HPS corner (opposite corner, next to the IR receiver) -->
  <rect x="700" y="62" width="168" height="112" rx="6" fill="#265f4d" stroke="#8ddb8c" stroke-dasharray="4 3"/>
  <text x="784" y="80" text-anchor="middle" fill="#8ddb8c" font-size="11">corner next to IR receiver</text>
  <circle cx="720" cy="100" r="7" fill="#2da44e" stroke="#ffffff"/>
  <text x="736" y="104" fill="#ffffff" font-size="12">USER LED</text>
  <rect x="712" y="116" width="15" height="15" rx="2" fill="#0d1117" stroke="#ffffff"/>
  <text x="736" y="128" fill="#7ee787" font-size="12" font-weight="bold">USER BUTTON ✔</text>
  <rect x="712" y="138" width="15" height="12" rx="2" fill="#0d1117" stroke="#ffb3b3"/>
  <text x="736" y="148" fill="#ffb3b3" font-size="11">HPS RST ✘</text>
  <rect x="712" y="155" width="15" height="12" rx="2" fill="#0d1117" stroke="#ffb3b3"/>
  <text x="736" y="165" fill="#ffb3b3" font-size="11">WARM RST ✘</text>
  <!-- KEY0..3 below -->
  <g fill="#0d1117" stroke="#8c959f">
    <rect x="820" y="190" width="28" height="22" rx="3"/><rect x="820" y="218" width="28" height="22" rx="3"/>
    <rect x="820" y="246" width="28" height="22" rx="3"/><rect x="820" y="274" width="28" height="22" rx="3"/>
  </g>
  <text x="812" y="246" text-anchor="end" fill="#d0d7de" font-size="11">KEY0–KEY3 (FPGA, not used)</text>
  <!-- LCD -->
  <rect x="690" y="290" width="110" height="64" rx="3" fill="#6fa8ff" stroke="#0e2a22"/>
  <text x="745" y="327" text-anchor="middle" fill="#0d1117" font-size="12">LCD</text>

  <!-- cables -->
  <path d="M250,150 C360,150 380,171 444,171" stroke="#0969da" stroke-width="4" fill="none"/>
  <text x="350" y="140" text-anchor="middle" fill="#0969da" font-weight="bold">Ethernet cable</text>
  <path d="M250,210 C360,210 370,81 448,81" stroke="#8250df" stroke-width="4" fill="none" stroke-dasharray="8 5"/>
  <text x="335" y="238" text-anchor="middle" fill="#8250df" font-weight="bold">USB-A ↔ mini-USB</text>
  <text x="335" y="255" text-anchor="middle" fill="#8250df" font-size="12">(not the USB-Blaster cable)</text>
</svg>
