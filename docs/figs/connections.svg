<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f2328">What to connect (schematic, not to scale)</text>

  <!-- laptop -->
  <rect x="40" y="90" width="230" height="150" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <rect x="60" y="108" width="190" height="110" rx="4" fill="#0d1117"/>
  <text x="155" y="160" text-anchor="middle" fill="#e6edf3">PuTTY + Ubuntu</text>
  <text x="155" y="180" text-anchor="middle" fill="#7ee787" font-size="12">192.168.10.1</text>
  <rect x="20" y="240" width="270" height="16" rx="4" fill="#d0d7de"/>
  <text x="155" y="280" text-anchor="middle" fill="#1f2328" font-weight="bold">Your laptop</text>

  <!-- board -->
  <rect x="520" y="60" width="350" height="290" rx="10" fill="#1b4d3e" stroke="#0e2a22" stroke-width="2"/>
  <text x="695" y="335" text-anchor="middle" fill="#ffffff" font-weight="bold">DE10-Standard</text>
  <!-- ports on the left edge -->
  <rect x="505" y="90" width="50" height="40" rx="3" fill="#d0d7de" stroke="#57606a"/>
  <text x="565" y="115" fill="#ffffff" font-size="12">Ethernet (RJ45)</text>
  <rect x="510" y="150" width="30" height="20" rx="3" fill="#d0d7de" stroke="#57606a"/>
  <text x="565" y="165" fill="#ffffff" font-size="12">UART mini-USB (next to Ethernet)</text>
  <rect x="510" y="270" width="30" height="24" rx="3" fill="#d0d7de" stroke="#57606a"/>
  <text x="565" y="287" fill="#ffffff" font-size="12">Power 12 V</text>
  <!-- HPS area -->
  <rect x="560" y="185" width="180" height="70" rx="6" fill="#265f4d" stroke="#8ddb8c" stroke-dasharray="4 3"/>
  <circle cx="585" cy="210" r="8" fill="#2da44e" stroke="#ffffff"/>
  <text x="602" y="215" fill="#ffffff" font-size="12">USER LED</text>
  <rect x="577" y="228" width="16" height="16" rx="2" fill="#0d1117" stroke="#ffffff"/>
  <text x="602" y="241" fill="#ffffff" font-size="12">USER BUTTON ✔</text>
  <text x="750" y="225" fill="#ffb3b3" font-size="11">avoid HPS_RST</text>
  <text x="750" y="240" fill="#ffb3b3" font-size="11">and WARM_RST</text>
  <!-- LCD -->
  <rect x="760" y="80" width="95" height="60" rx="3" fill="#c6d6a0" stroke="#0e2a22"/>
  <text x="807" y="115" text-anchor="middle" fill="#30402a" font-size="12">LCD</text>
  <!-- SD -->
  <rect x="790" y="265" width="60" height="40" rx="3" fill="#57606a" stroke="#ffffff"/>
  <text x="820" y="290" text-anchor="middle" fill="#ffffff" font-size="11">microSD</text>
  <text x="820" y="322" text-anchor="middle" fill="#d0d7de" font-size="10">(underside)</text>

  <!-- cables -->
  <path d="M290,150 C400,150 420,110 505,110" stroke="#0969da" stroke-width="4" fill="none"/>
  <text x="390" y="100" text-anchor="middle" fill="#0969da" font-weight="bold">Ethernet cable</text>
  <path d="M290,200 C400,200 420,160 510,160" stroke="#8250df" stroke-width="4" fill="none" stroke-dasharray="8 5"/>
  <text x="390" y="215" text-anchor="middle" fill="#8250df" font-weight="bold">USB-A ↔ mini-USB</text>
  <text x="390" y="232" text-anchor="middle" fill="#8250df" font-size="12">(not the USB-Blaster cable)</text>
</svg>
