<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="250" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f2328">HPS GPIO1 data register — the 5 bits ReflexBoard uses</text>
  <!-- 32 cells, bit 31 on the left -->
  <g id="cells">
    <rect x="34" y="60" width="832" height="40" fill="#f6f8fa" stroke="#d0d7de"/>
  </g>
  <!-- cell width 26, bit b at x = 34 + (31-b)*26 -->
  <!-- bit 25 -->
  <rect x="190" y="60" width="26" height="40" fill="#fff1e5" stroke="#fb8f44"/>
  <!-- bit 24 -->
  <rect x="216" y="60" width="26" height="40" fill="#dafbe1" stroke="#4ac26b"/>
  <!-- bit 15 -->
  <rect x="450" y="60" width="26" height="40" fill="#ddf4ff" stroke="#54aeff"/>
  <!-- bit 12 -->
  <rect x="528" y="60" width="26" height="40" fill="#ddf4ff" stroke="#54aeff"/>
  <!-- bit 8 -->
  <rect x="632" y="60" width="26" height="40" fill="#ddf4ff" stroke="#54aeff"/>
  <g fill="#57606a" font-size="11" text-anchor="middle">
    <text x="47" y="116">31</text><text x="203" y="116">25</text><text x="229" y="116">24</text>
    <text x="463" y="116">15</text><text x="541" y="116">12</text><text x="645" y="116">8</text>
    <text x="853" y="116">0</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="203" y1="122" x2="140" y2="165"/>
    <line x1="229" y1="122" x2="300" y2="165"/>
    <line x1="463" y1="122" x2="430" y2="165"/>
    <line x1="541" y1="122" x2="580" y2="165"/>
    <line x1="645" y1="122" x2="740" y2="165"/>
  </g>
  <g text-anchor="middle">
    <rect x="70" y="165" width="140" height="62" rx="6" fill="#fff1e5" stroke="#fb8f44"/>
    <text x="140" y="187" font-weight="bold" fill="#1f2328">USER BUTTON</text>
    <text x="140" y="204" fill="#57606a">input, 0 = pressed</text>
    <text x="140" y="220" fill="#57606a" font-size="11">0x02000000</text>
    <rect x="230" y="165" width="140" height="62" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="300" y="187" font-weight="bold" fill="#1f2328">USER LED</text>
    <text x="300" y="204" fill="#57606a">output, 1 = on</text>
    <text x="300" y="220" fill="#57606a" font-size="11">0x01000000</text>
    <rect x="390" y="165" width="140" height="62" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="460" y="187" font-weight="bold" fill="#1f2328">LCD RESET</text>
    <text x="460" y="204" fill="#57606a">output, active low</text>
    <text x="460" y="220" fill="#57606a" font-size="11">0x00008000</text>
    <rect x="550" y="165" width="140" height="62" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="620" y="187" font-weight="bold" fill="#1f2328">LCD D/C (A0)</text>
    <text x="620" y="204" fill="#57606a">1 = data, 0 = command</text>
    <text x="620" y="220" fill="#57606a" font-size="11">0x00001000</text>
    <rect x="710" y="165" width="150" height="62" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="785" y="187" font-weight="bold" fill="#1f2328">LCD BACKLIGHT</text>
    <text x="785" y="204" fill="#57606a">output, 1 = on</text>
    <text x="785" y="220" fill="#57606a" font-size="11">0x00000100</text>
  </g>
</svg>
