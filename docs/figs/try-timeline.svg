<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f2328">One try, on a time line</text>

  <!-- phases -->
  <rect x="60" y="60" width="380" height="44" fill="#ffebe9" stroke="#ff8182"/>
  <text x="250" y="80" text-anchor="middle" fill="#cf222e" font-weight="bold">random wait (1–4 s)</text>
  <text x="250" y="97" text-anchor="middle" fill="#57606a">a press here = FALSE START</text>
  <rect x="440" y="60" width="170" height="44" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="525" y="80" text-anchor="middle" fill="#1a7f37" font-weight="bold">LED on</text>
  <text x="525" y="97" text-anchor="middle" fill="#57606a">tight polling loop</text>
  <rect x="610" y="60" width="230" height="44" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="725" y="80" text-anchor="middle" fill="#1f2328" font-weight="bold">show result (1.5 s)</text>
  <text x="725" y="97" text-anchor="middle" fill="#57606a">LCD refresh + printf</text>

  <!-- axis -->
  <line x1="40" y1="140" x2="870" y2="140" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
  <text x="866" y="160" text-anchor="end" fill="#57606a">time</text>
  <line x1="60" y1="132" x2="60" y2="148" stroke="#1f2328" stroke-width="2"/>
  <line x1="440" y1="125" x2="440" y2="155" stroke="#1a7f37" stroke-width="3"/>
  <line x1="610" y1="125" x2="610" y2="155" stroke="#0969da" stroke-width="3"/>
  <text x="40" y="172" fill="#1f2328">"GET READY" on LCD</text>
  <text x="440" y="172" text-anchor="middle" fill="#1a7f37" font-weight="bold">t0: LED on</text>
  <text x="610" y="172" text-anchor="middle" fill="#0969da" font-weight="bold">t1: button read as pressed</text>

  <!-- measurement -->
  <line x1="442" y1="200" x2="608" y2="200" stroke="#1f2328" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="608" y1="200" x2="442" y2="200" stroke="#1f2328" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="525" y="222" text-anchor="middle" fill="#1f2328" font-weight="bold">reaction = t1 − t0   (≤ 2 s, else TOO SLOW)</text>
  <text x="525" y="242" text-anchor="middle" fill="#57606a">clock_gettime(CLOCK_MONOTONIC): no LCD, no printf inside this window</text>
</svg>
