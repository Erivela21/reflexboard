<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- Host -->
  <rect x="20" y="40" width="250" height="340" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="145" y="68" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f2328">Host (your PC)</text>
  <text x="145" y="88" text-anchor="middle" fill="#57606a">Windows + WSL Ubuntu</text>
  <rect x="45" y="110" width="200" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="145" y="133" text-anchor="middle" fill="#1f2328">arm-linux-gnueabihf-gcc</text>
  <text x="145" y="152" text-anchor="middle" fill="#57606a" font-size="12">cross-compiler (Linaro 7.4)</text>
  <rect x="45" y="180" width="200" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="145" y="203" text-anchor="middle" fill="#1f2328">make run / make debug</text>
  <text x="145" y="222" text-anchor="middle" fill="#57606a" font-size="12">scp + ssh + gdb</text>
  <rect x="45" y="250" width="200" height="56" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="145" y="273" text-anchor="middle" fill="#1f2328">make sim</text>
  <text x="145" y="292" text-anchor="middle" fill="#57606a" font-size="12">play on the PC first</text>
  <rect x="45" y="320" width="200" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="145" y="345" text-anchor="middle" fill="#1f2328">PuTTY (serial console)</text>

  <!-- Board -->
  <rect x="380" y="20" width="500" height="390" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="630" y="48" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f2328">DE10-Standard</text>
  <rect x="400" y="62" width="460" height="232" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="416" y="84" fill="#57606a">HPS (ARM Cortex-A9) running Linux</text>

  <rect x="420" y="98" width="200" height="56" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="520" y="121" text-anchor="middle" font-weight="bold" fill="#1f2328">reflexboard</text>
  <text x="520" y="140" text-anchor="middle" fill="#57606a" font-size="12">user-space program (root)</text>
  <rect x="640" y="98" width="200" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="740" y="121" text-anchor="middle" fill="#1f2328">sshd / gdbserver</text>
  <text x="740" y="140" text-anchor="middle" fill="#57606a" font-size="12">receive + start the binary</text>

  <rect x="420" y="168" width="420" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="630" y="190" text-anchor="middle" fill="#1f2328">/dev/mem + mmap()  →  HPS registers at 0xFC000000</text>

  <rect x="420" y="218" width="200" height="60" rx="6" fill="#fff1e5" stroke="#fb8f44"/>
  <text x="520" y="241" text-anchor="middle" font-weight="bold" fill="#1f2328">GPIO1</text>
  <text x="520" y="260" text-anchor="middle" fill="#57606a" font-size="12">LED, button, LCD control pins</text>
  <rect x="640" y="218" width="200" height="60" rx="6" fill="#fff1e5" stroke="#fb8f44"/>
  <text x="740" y="241" text-anchor="middle" font-weight="bold" fill="#1f2328">SPIM0</text>
  <text x="740" y="260" text-anchor="middle" fill="#57606a" font-size="12">SPI master → LCD pixels</text>

  <!-- peripherals -->
  <rect x="400" y="320" width="140" height="70" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <circle cx="430" cy="355" r="10" fill="#2da44e"/>
  <text x="485" y="350" text-anchor="middle" fill="#1f2328">USER LED</text>
  <text x="485" y="368" text-anchor="middle" fill="#57606a" font-size="12">bit 24</text>
  <rect x="560" y="320" width="140" height="70" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <rect x="580" y="345" width="20" height="20" rx="3" fill="#57606a"/>
  <text x="650" y="350" text-anchor="middle" fill="#1f2328">USER BUTTON</text>
  <text x="650" y="368" text-anchor="middle" fill="#57606a" font-size="12">bit 25</text>
  <rect x="720" y="320" width="140" height="70" rx="8" fill="#c6d6a0" stroke="#1f2328"/>
  <text x="790" y="350" text-anchor="middle" fill="#1f2328">LCD 128×64</text>
  <text x="790" y="368" text-anchor="middle" fill="#30402a" font-size="12">bits 8, 12, 15 + SPI</text>

  <line x1="490" y1="278" x2="470" y2="318" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="545" y1="318" x2="560" y2="278" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="270" x2="750" y2="318" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="278" x2="785" y2="318" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="154" x2="520" y2="168" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="202" x2="520" y2="218" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="202" x2="720" y2="218" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- links -->
  <line x1="245" y1="208" x2="378" y2="208" stroke="#0969da" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="312" y="182" text-anchor="middle" fill="#0969da" font-weight="bold">Ethernet</text>
  <text x="312" y="198" text-anchor="middle" fill="#0969da" font-size="12">.1 ↔ .13</text>
  <line x1="245" y1="340" x2="398" y2="300" stroke="#8250df" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="300" y="352" fill="#8250df" font-size="12">USB UART (COMx)</text>
</svg>
